name: KhaYin TV Android Release & Cloudflare R2 Pipeline

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version tag override (e.g. 1.0.6). Leave empty to use build.gradle.kts'
        required: false
        type: string
        default: ''
      channel:
        description: 'Target channel (auto, dev, release)'
        required: true
        type: choice
        options:
          - auto
          - dev
          - release
        default: auto
      upload_to_r2:
        description: 'Upload release artifacts to Cloudflare R2'
        required: true
        type: boolean
        default: true
      create_github_release:
        description: 'Publish or update GitHub Release (only for release channel/tags)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: khayin-tv-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve Version & Channel Metadata
  # ---------------------------------------------------------------------------
  metadata:
    name: Resolve Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      clean_version: ${{ steps.version_step.outputs.clean_version }}
      channel: ${{ steps.version_step.outputs.channel }}
      target_dir: ${{ steps.version_step.outputs.target_dir }}
      is_release: ${{ steps.version_step.outputs.is_release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version & Channel
        id: version_step
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            RAW_VERSION="${{ inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d'"' -f2 | tr -d ' \r\n')
            if [ -z "${RAW_VERSION}" ]; then
              RAW_VERSION="1.0.5"
            fi
          fi
          
          CLEAN_VERSION=$(echo "${RAW_VERSION}" | tr -cd '[:alnum:]._-')
          
          # Determine channel: release if tagged v* or inputs.channel == 'release', else dev
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ inputs.channel }}" == "release" ]]; then
            CHANNEL="release"
            TARGET_DIR="v${CLEAN_VERSION}"
            IS_RELEASE="true"
          else
            CHANNEL="dev"
            TARGET_DIR="dev/v${CLEAN_VERSION}"
            IS_RELEASE="false"
          fi

          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "target_dir=${TARGET_DIR}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${CLEAN_VERSION}, channel: ${CHANNEL}, target R2 dir: ${TARGET_DIR}"

  # ---------------------------------------------------------------------------
  # 2. Build Android TV APKs (Optimized)
  # ---------------------------------------------------------------------------
  build-tv:
    name: Build Android TV APKs
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure Keystore, Environment & Gradle Properties
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KHAYIN_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KHAYIN_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.NUVIO_RELEASE_KEY_ALIAS || 'khayintv' }}
          KEY_PASSWORD: ${{ secrets.KHAYIN_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.NUVIO_RELEASE_KEY_PASSWORD || '815787' }}
          STORE_PASSWORD: ${{ secrets.KHAYIN_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.NUVIO_RELEASE_STORE_PASSWORD || '815787' }}
        run: |
          mkdir -p ~/.gradle
          # Optimized Gradle properties for GitHub Actions Ubuntu Runners (7GB physical RAM)
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          kotlin.incremental=false
          EOF

          cat << 'EOF' > local.properties
          sdk.dir=/usr/local/lib/android/sdk
          USE_LOCAL_FFMPEG_DECODER=false
          EOF

          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > release.jks
            echo "NUVIO_RELEASE_STORE_FILE=$(pwd)/release.jks" >> local.properties
            echo "NUVIO_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> local.properties
            echo "NUVIO_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> local.properties
            echo "NUVIO_RELEASE_STORE_PASSWORD=${STORE_PASSWORD}" >> local.properties
            echo "KHAYIN_RELEASE_STORE_FILE=$(pwd)/release.jks" >> local.properties
            echo "KHAYIN_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> local.properties
            echo "KHAYIN_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> local.properties
            echo "KHAYIN_RELEASE_STORE_PASSWORD=${STORE_PASSWORD}" >> local.properties
            echo "Signing configured with provided keystore."
          else
            echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "No keystore secret found; falling back to debug signing."
          fi

      - name: Build Android TV APK
        env:
          IS_RELEASE: ${{ needs.metadata.outputs.is_release }}
        run: |
          if [ "${IS_RELEASE}" = "true" ]; then
            ./gradlew :app:assembleFullRelease --no-daemon --build-cache --parallel || ./gradlew :app:assembleFullDebug --no-daemon --build-cache --parallel
          else
            ./gradlew :app:assembleFullDebug --no-daemon --build-cache --parallel
          fi

      - name: Stage & Rename Release Artifacts
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          CHANNEL="${{ needs.metadata.outputs.channel }}"
          mkdir -p dist
          
          APK_DIR="app/build/outputs/apk/full/release"
          if [ ! -d "$APK_DIR" ] || [ -z "$(ls -A "$APK_DIR" 2>/dev/null)" ]; then
            APK_DIR="app/build/outputs/apk/full/debug"
          fi

          echo "Collecting APKs from: $APK_DIR"
          MAIN_APK=$(find "$APK_DIR" -type f -name "*arm64-v8a*.apk" 2>/dev/null | head -n 1)
          if [ -z "$MAIN_APK" ]; then
            MAIN_APK=$(find "$APK_DIR" -type f -name "*universal*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$MAIN_APK" ]; then
            MAIN_APK=$(find "$APK_DIR" -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          FALLBACK_APK=$(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)

          SUFFIX=""
          if [ "${CHANNEL}" = "dev" ]; then
            SUFFIX="-dev"
          fi

          if [ -n "$MAIN_APK" ] && [ -f "$MAIN_APK" ]; then
            cp "$MAIN_APK" "dist/khayin-tv-v${VERSION}${SUFFIX}.apk"
            echo "Renamed: $MAIN_APK -> dist/khayin-tv-v${VERSION}${SUFFIX}.apk"
          elif [ -n "$FALLBACK_APK" ] && [ -f "$FALLBACK_APK" ]; then
            cp "$FALLBACK_APK" "dist/khayin-tv-v${VERSION}${SUFFIX}.apk"
            echo "Renamed fallback: $FALLBACK_APK -> dist/khayin-tv-v${VERSION}${SUFFIX}.apk"
          else
            echo "Error: No APK found!" >&2
            exit 1
          fi

          # Also copy all generated APK variants to dist
          find "$APK_DIR" -type f -name "*.apk" -exec cp {} dist/ \;

          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khayin-tv-${{ needs.metadata.outputs.channel }}-artifacts
          path: dist/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Upload to Cloudflare R2 & Create GitHub Release (if applicable)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Upload to Cloudflare R2 & Publish
    needs: [metadata, build-tv]
    runs-on: ubuntu-latest
    if: always() && (needs.build-tv.result == 'success')
    steps:
      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          name: khayin-tv-${{ needs.metadata.outputs.channel }}-artifacts
          path: release-files

      - name: List Collected Files
        run: |
          echo "=== Collected Release Artifacts ==="
          ls -la release-files/

      # Upload to Cloudflare R2 using AWS CLI with custom S3 endpoint
      - name: Upload to Cloudflare R2 Bucket
        if: inputs.upload_to_r2 != false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TARGET_DIR: ${{ needs.metadata.outputs.target_dir }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          MISSING=0
          if [ -z "${R2_ACCOUNT_ID}" ]; then echo "::warning ::Secret R2_ACCOUNT_ID is empty or not found."; MISSING=1; fi
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then echo "::warning ::Secret R2_ACCESS_KEY_ID is empty or not found."; MISSING=1; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then echo "::warning ::Secret R2_SECRET_ACCESS_KEY is empty or not found."; MISSING=1; fi
          if [ -z "${R2_BUCKET_NAME}" ]; then echo "::warning ::Secret R2_BUCKET_NAME is empty or not found."; MISSING=1; fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo "Error: Cloudflare R2 secrets are missing. Skipping R2 upload."
            exit 1
          fi

          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          
          echo "Uploading artifacts to Cloudflare R2: s3://${R2_BUCKET_NAME}/${TARGET_DIR}/"
          
          for file in release-files/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename -> s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}"
              aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}" \
                --endpoint-url "${ENDPOINT_URL}" \
                --region auto
              
              # Also update latest copy under channel
              if [ "${CHANNEL}" = "dev" ]; then
                echo "Uploading to dev/latest/ -> s3://${R2_BUCKET_NAME}/dev/latest/${filename}"
                aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/dev/latest/${filename}" \
                  --endpoint-url "${ENDPOINT_URL}" \
                  --region auto
              fi
            fi
          done

          echo "Upload complete! Contents in bucket folder ${TARGET_DIR}:"
          aws s3 ls "s3://${R2_BUCKET_NAME}/${TARGET_DIR}/" --endpoint-url "${ENDPOINT_URL}" --region auto || true

      - name: Create or Update GitHub Release
        if: (needs.metadata.outputs.is_release == 'true') && (inputs.create_github_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.clean_version }}
          name: KhaYin TV v${{ needs.metadata.outputs.clean_version }}
          body: |
            ### 📺 KhaYin TV v${{ needs.metadata.outputs.clean_version }} (Android TV Release)
            
            Dedicated Leanback / Android TV application built with Jetpack Compose for TV.
            
            #### Highlights:
            - **Native 10-Foot UI**: Remote control & D-pad navigation.
            - **Multilingual & Burmese**: Myanmar (Burmese) subtitles and localization.
            - **High Performance Playback**: Media3 buffer-preserving sidecar engine.
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
