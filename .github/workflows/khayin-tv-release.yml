name: KhaYin TV Android Release & Cloudflare R2 Pipeline

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version tag override (e.g. 1.0.2). Leave empty to use build.gradle.kts'
        required: false
        type: string
        default: ''
      upload_to_r2:
        description: 'Upload release artifacts to Cloudflare R2'
        required: true
        type: boolean
        default: true
      create_github_release:
        description: 'Publish or update GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: khayin-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve Version Metadata
  # ---------------------------------------------------------------------------
  metadata:
    name: Resolve Version Metadata
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      clean_version: ${{ steps.version_step.outputs.clean_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            RAW_VERSION="${{ inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d'"' -f2 | tr -d ' \r\n')
            if [ -z "${RAW_VERSION}" ]; then
              RAW_VERSION="1.0.2"
            fi
          fi
          
          CLEAN_VERSION=$(echo "${RAW_VERSION}" | tr -cd '[:alnum:]._-')
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${CLEAN_VERSION}"

  # ---------------------------------------------------------------------------
  # 2. Build Android TV APKs
  # ---------------------------------------------------------------------------
  build-tv:
    name: Build Android TV APKs
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Keystore & Environment Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KHAYIN_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KHAYIN_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.NUVIO_RELEASE_KEY_ALIAS || 'nuviotv' }}
          KEY_PASSWORD: ${{ secrets.KHAYIN_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.NUVIO_RELEASE_KEY_PASSWORD || '815787' }}
          STORE_PASSWORD: ${{ secrets.KHAYIN_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.NUVIO_RELEASE_STORE_PASSWORD || '815787' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || 'https://03b275d4c26ccf95402bcd0a9a9f9b7f@o4511970100641792.ingest.us.sentry.io/4511970104705024' }}
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

          cat << 'EOF' > local.properties
          sdk.dir=/usr/local/lib/android/sdk
          USE_LOCAL_FFMPEG_DECODER=false
          EOF
          echo "SENTRY_DSN=${SENTRY_DSN}" >> local.properties

          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > release.jks
            echo "NUVIO_RELEASE_STORE_FILE=$(pwd)/release.jks" >> local.properties
            echo "NUVIO_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> local.properties
            echo "NUVIO_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> local.properties
            echo "NUVIO_RELEASE_STORE_PASSWORD=${STORE_PASSWORD}" >> local.properties
            echo "Signing configured with provided keystore."
          else
            echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "No keystore secret found; falling back to debug/default signing."
          fi

      - name: Build Android TV Release APK
        run: |
          ./gradlew :app:assembleFullRelease || ./gradlew :app:assembleFullDebug

      - name: Stage & Rename Release Artifacts
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          mkdir -p dist
          
          APK_DIR="app/build/outputs/apk/full/release"
          if [ ! -d "$APK_DIR" ] || [ -z "$(ls -A "$APK_DIR" 2>/dev/null)" ]; then
            APK_DIR="app/build/outputs/apk/full/debug"
          fi

          echo "Collecting APKs from: $APK_DIR"
          MAIN_APK=$(find "$APK_DIR" -type f -name "*.apk" 2>/dev/null | head -n 1)
          FALLBACK_APK=$(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$MAIN_APK" ] && [ -f "$MAIN_APK" ]; then
            cp "$MAIN_APK" "dist/khayin-tv-v${VERSION}.apk"
            echo "Renamed: $MAIN_APK -> dist/khayin-tv-v${VERSION}.apk"
          elif [ -n "$FALLBACK_APK" ] && [ -f "$FALLBACK_APK" ]; then
            cp "$FALLBACK_APK" "dist/khayin-tv-v${VERSION}.apk"
            echo "Renamed fallback: $FALLBACK_APK -> dist/khayin-tv-v${VERSION}.apk"
          else
            echo "Error: No APK found!" >&2
            exit 1
          fi

          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khayin-tv-artifacts
          path: dist/*
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Upload to Cloudflare R2 & Create GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Upload to Cloudflare R2 & Publish Release
    needs: [metadata, build-tv]
    runs-on: ubuntu-latest
    if: always() && (needs.build-tv.result == 'success')
    steps:
      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          name: khayin-tv-artifacts
          path: release-files

      - name: List Collected Release Files
        run: |
          echo "=== Collected Release Artifacts ==="
          ls -la release-files/

      # Upload to Cloudflare R2 using AWS CLI with custom S3 endpoint
      - name: Upload to Cloudflare R2 Bucket
        if: github.event_name == 'push' || inputs.upload_to_r2 != false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          MISSING=0
          if [ -z "${R2_ACCOUNT_ID}" ]; then echo "::warning ::Secret R2_ACCOUNT_ID is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then echo "::warning ::Secret R2_ACCESS_KEY_ID is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then echo "::warning ::Secret R2_SECRET_ACCESS_KEY is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${R2_BUCKET_NAME}" ]; then echo "::warning ::Secret R2_BUCKET_NAME is empty or not found in repository secrets."; MISSING=1; fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo "Error: Cloudflare R2 secrets are missing. Skipping R2 upload."
            exit 1
          fi

          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TARGET_DIR="v${VERSION}"
          
          echo "Uploading release artifacts to Cloudflare R2: s3://${R2_BUCKET_NAME}/${TARGET_DIR}/"
          
          for file in release-files/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename -> s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}"
              aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}" \
                --endpoint-url "${ENDPOINT_URL}" \
                --region auto
            fi
          done

          echo "Upload complete! Contents in bucket folder v${VERSION}:"
          aws s3 ls "s3://${R2_BUCKET_NAME}/${TARGET_DIR}/" --endpoint-url "${ENDPOINT_URL}" --region auto || true

      - name: Create or Update GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.create_github_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.clean_version }}
          name: KhaYin TV v${{ needs.metadata.outputs.clean_version }}
          body: |
            ### 📺 KhaYin TV v${{ needs.metadata.outputs.clean_version }} (Android TV Release)
            
            Dedicated Leanback / Android TV application built with Jetpack Compose for TV.
            
            #### Highlights:
            - **Native 10-Foot UI**: Purpose-built remote control & D-pad navigation.
            - **KhaYin Security Bridge**: HMAC signature verification & payload protection.
            - **Rich Genre Catalogs**: Action, Animation, Comedy, Crime, Documentary, Drama, Family, Fantasy, Horror, Mystery, Romance, Sci-Fi, Thriller, and more.
            - **Multilingual & Burmese**: Complete Myanmar (Burmese) localization.
            - **High Performance Playback**: Media3 player engine with automatic fallback & streaming optimizations.
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
